server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: employee-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# App Security & Seed accounts
app:
  security:
    admin:
      username: ${APP_SECURITY_ADMIN_USERNAME:admin@company.com}
      password: ${APP_SECURITY_ADMIN_PASSWORD:Admin@123}
      fullName: System Administrator
    user:
      username: ${APP_SECURITY_USER_USERNAME:user@company.com}
      password: ${APP_SECURITY_USER_PASSWORD:User@123}
      fullName: Standard Staff User
  ai:
    provider: ${AI_PROVIDER:openai}
    apiKey: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    baseUrl: ${AI_BASE_URL:https://api.openai.com/v1}
    timeoutSeconds: ${AI_TIMEOUT_SECONDS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
